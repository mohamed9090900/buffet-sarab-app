<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#0d1117">
<title>تأكيد البريد — البوفيه</title>
<style>
html,body{margin:0;min-height:100%;background:#0d1117;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}.card{width:min(430px,100%);text-align:center;background:#151a21;border:1px solid #30363d;border-radius:24px;padding:30px;box-sizing:border-box;box-shadow:0 24px 80px rgba(0,0,0,.5)}.mark{width:76px;height:76px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;background:#123d2a;font-size:42px}.mark.err{background:#5b1d24}h1{font-size:23px;margin:0 0 10px}p{margin:0;color:#b7c0cc;line-height:1.8}
</style>
</head>
<body><main class="card"><div id="mark" class="mark">✓</div><h1 id="title">تم تأكيد البريد الإلكتروني بنجاح</h1><p id="message">يمكنك إغلاق هذه الصفحة والعودة إلى تطبيق البوفيه.</p></main>
<script>
(function(){
 const h=new URLSearchParams((location.hash||'').replace(/^#/,'')),q=new URLSearchParams(location.search||'');
 const err=h.get('error_description')||q.get('error_description')||h.get('error')||q.get('error');
 const code=h.get('error_code')||q.get('error_code')||'';
 if(err){
   const reused=/expired|invalid|already|used/i.test(String(err))||/expired|invalid/i.test(String(code));
   document.getElementById('mark').classList.add('err');document.getElementById('mark').textContent='!';
   document.getElementById('title').textContent=reused?'رابط التأكيد تم استخدامه أو انتهت صلاحيته':'تعذر تأكيد البريد الإلكتروني';
   document.getElementById('message').textContent=reused?'لو كنت أكدت البريد قبل كده، اقفل الصفحة وارجع لتطبيق البوفيه وسجل الدخول.':'ارجع لتطبيق البوفيه وحاول من جديد.';
 }
 try{history.replaceState(null,'',location.pathname)}catch(e){}
})();
</script></body></html>
